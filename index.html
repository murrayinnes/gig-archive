<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0000F2">
<title>Gig Archive</title>
<style>
@font-face{
  font-family:'Departure Mono';
  src:url(fonts/DepartureMono-Regular.woff2) format('woff2');
  font-weight:400;font-style:normal;font-display:block;
}
</style>
<style>
:root{
  --blue:#05060F; --paper:#FFF; --ghost:rgba(255,255,255,.062);
  --hair:rgba(255,255,255,.26); --mute:rgba(255,255,255,.62);
  --serif:'Departure Mono',ui-monospace,monospace;
  --mono:'Departure Mono',ui-monospace,monospace;
  --pad:clamp(16px,3.2vw,44px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100dvh;background:#05060F;color:var(--paper);
  font-family:var(--mono);font-size:11px;line-height:1.5;letter-spacing:1px;
  text-transform:uppercase;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
a{color:inherit;text-decoration:none}
button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;
  background:none;border:none;cursor:pointer}
:focus-visible{outline:1px solid var(--paper);outline-offset:4px}
.view{display:none}
.view.on{display:block}
.serif{font-family:var(--serif);text-transform:uppercase;font-weight:400;
  letter-spacing:2px;line-height:1.06}

/* ── deep field ──────────────────────────────────────── */
#space,#nebula,#stars,#stars2,#vignette{position:fixed;inset:0;pointer-events:none}
#space{z-index:-4;background:
  radial-gradient(120vw 110vh at 50% 40%, #0A0C1C 0%, #05060F 55%, #020309 100%)}
#nebula{z-index:-3;background-image:url("img/nebula.webp");
  background-size:cover;background-position:center;
  opacity:.9;mix-blend-mode:screen;
  animation:swell 90s ease-in-out infinite alternate}
@keyframes swell{to{transform:scale(1.06) translate3d(-1.2%,0.8%,0)}}

  radial-gradient(120vw 110vh at 50% 44%,transparent 38%,rgba(0,0,0,.72) 100%)}

/* ── landing ─────────────────────────────────────────── */
#landing.on{display:grid}
#landing{
  position:relative;min-height:100dvh;place-items:center;
  grid-template-rows:1fr auto 1fr;padding:var(--pad);cursor:pointer;
}
#watermark{
  position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;
  font-family:var(--serif);font-weight:300;color:var(--ghost);
  font-size:clamp(44px,17vw,176px);line-height:.86;text-align:center;
  letter-spacing:2px;user-select:none;
}
#landing .art{
  grid-row:2;position:relative;z-index:2;width:min(74vw,820px);
  max-height:54dvh;display:grid;place-items:center;
}
#landing .art img,#landing .art svg{
  max-width:100%;max-height:54dvh;width:auto;height:auto;display:block;
  filter:drop-shadow(0 26px 52px rgba(0,0,0,.75)) drop-shadow(0 2px 8px rgba(0,0,0,.5))}
#landing h1{
  grid-row:1;align-self:end;position:relative;z-index:2;
  font-size:clamp(22px,4.6vw,55px);padding-bottom:.6em;
}
#landing .count{
  grid-row:3;align-self:start;position:relative;z-index:2;
  font-family:var(--serif);font-size:clamp(22px,3vw,44px);
  padding-top:.8em;letter-spacing:3px;
}
#landing:hover h1{text-decoration:underline;text-underline-offset:.22em;
  text-decoration-thickness:1px}

/* ── shared chrome ───────────────────────────────────── */
.bar{
  position:fixed;left:0;right:0;z-index:30;display:flex;justify-content:space-between;
  align-items:center;gap:12px;padding:14px var(--pad);pointer-events:none;
  font-size:11px;color:var(--mute);
}
.bar.top{top:0}
.bar.bot{bottom:0;padding-top:26px;
  background:linear-gradient(transparent,rgba(3,4,12,.92) 62%)}
.bar a,.bar button{pointer-events:auto}
.bar a:hover,.bar button:hover{color:var(--paper)}
.page{padding:56px var(--pad) 96px;min-height:100dvh}

/* ── archive index ───────────────────────────────────── */
.grid{
  display:grid;gap:clamp(16px,2.2vw,34px);
  grid-template-columns:repeat(5,minmax(0,1fr));
  max-width:1720px;margin:0 auto;
}
.cell{display:block;text-align:left}
.cell .frame{
  position:relative;aspect-ratio:1.5/1;display:block;
  transition:transform .22s cubic-bezier(.2,.7,.3,1),filter .22s;
}
.cell .frame img{
  position:absolute;inset:0;margin:auto;
  max-width:100%;max-height:100%;width:auto;height:auto;
  object-fit:contain;
  filter:drop-shadow(0 16px 26px rgba(0,0,0,.62));
}
.cell:hover .frame{transform:translateY(-4px) scale(1.035)}
.cell:hover .frame img{filter:drop-shadow(0 24px 38px rgba(0,0,0,.75))}
.cell .frame.empty{border:1px dashed var(--hair)}
.cell b{display:block;font-family:var(--serif);font-weight:400;font-size:22px;
  letter-spacing:1px;margin:22px 0 0;line-height:22px;min-height:44px;
  text-transform:uppercase}
.cell i{font-style:normal;font-size:11px;color:var(--mute);letter-spacing:1px}
.empty-note{grid-column:1/-1;text-align:center;color:var(--mute);padding:80px 0}

/* ── filter ──────────────────────────────────────────── */
#filterBtn{display:flex;align-items:center;gap:8px;pointer-events:auto;
  color:var(--mute);transition:color .16s}

  <div id="watermark" aria-hidden="true">Gig<br>Archive</div>

  <div class="bar top">
    <span><a href="#/">Gig Archive</a>
      <a href="#/venues" style="margin-left:18px">Venues</a>

    <button id="filterBtn" aria-expanded="false" aria-controls="filterPanel">
      <svg width="13" height="11" viewBox="0 0 13 11" fill="none" aria-hidden="true">
        <path d="M0 1h13M2 5h9M5 9h3" stroke="currentColor" stroke-width="1"
              shape-rendering="crispEdges"/>
      </svg>
      <span id="archCount"></span><span class="dot"></span>
    </button>

      <div class="fcol"><h4>Year</h4><div class="fopts" id="fYear"></div></div>

<script>
let EVENTS = [], LINEUPS = {}, VENUE_PHOTO = {}, ARTIST_PHOTO = {}, STATS = {};
const DRAW = {}, VENUE_ART = {};


const $ = s => document.querySelector(s);
const slug = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '')  // Òran Mór -> oran-mor
  .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const money = n => n == null ? '—' : '£' + n.toFixed(2);
const fmt = iso => new Date(iso + 'T12:00:00')
  .toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── landing ─────────────────────────────────────────── */
function paintLanding() {
  const shown = EVENTS.filter(e => e.image);
  const pick = shown[Math.floor(Math.random() * shown.length)];
  if (pick) $('#landingArt').innerHTML =
    `<img src="${pick.image}" alt="Ticket for ${esc(pick.artist)}">`;
  $('#landingCount').textContent = STATS.count;
}
const enter = () => { location.hash = '#/archive'; };
$('#landing').onclick = enter;
$('#landing').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enter(); } };

/* ── archive grid + filters ──────────────────────────── */
const F = {year: new Set(), artist: new Set(), venue: new Set()};
const facetOf = {year: e => e.date.slice(0,4), artist: e => e.artist, venue: e => e.canon};

const passes = (e, skip) => ['year','artist','venue'].every(k =>
  k === skip || !F[k].size || F[k].has(facetOf[k](e)));

function tally(k) {
  const m = new Map();
  for (const e of EVENTS) if (passes(e, k)) {
    const v = facetOf[k](e);
    m.set(v, (m.get(v) || 0) + 1);
  }
  for (const v of F[k]) if (!m.has(v)) m.set(v, 0);
  return [...m].sort((a, b) => k === 'year'
    ? a[0].localeCompare(b[0]) : a[0].localeCompare(b[0]));
}

function renderFacets() {
  for (const k of ['year','artist','venue']) {
    const host = $('#f' + k[0].toUpperCase() + k.slice(1));
    host.innerHTML = tally(k).map(([v, n]) =>
      `<button class="fopt${F[k].has(v) ? ' sel' : ''}" data-k="${k}"
        data-v="${esc(v)}">${esc(v)}<span>${n}</span></button>`).join('');
  }
}

function renderGrid() {
  const rows = EVENTS.filter(e => passes(e));
  $('#grid').innerHTML = rows.length ? rows.map(e => `
    <a class="cell" href="#/gig/${e.id}">
      <span class="frame${e.image ? '' : ' empty'}">${e.image
        ? `<img src="${e.thumb || e.image}" alt="Ticket for ${esc(e.artist)}" loading="lazy">`
        : ''}</span>
      <b>${esc(e.artist)}</b>
      <i>${e.date.slice(0,4)} · ${esc(e.canon)}</i>
    </a>`).join('') : '<p class="empty-note">Nothing matches those filters</p>';

  const active = F.year.size + F.artist.size + F.venue.size;
  $('#archCount').textContent = active
    ? `${rows.length} of ${EVENTS.length}` : `${EVENTS.length} tickets`;
  $('#fCount').textContent = `${rows.length} of ${EVENTS.length} shown`;
  $('#filterBtn').classList.toggle('active', active > 0);
  renderFacets();
  requestAnimationFrame(measurePanel);
}

document.addEventListener('click', ev => {
  const opt = ev.target.closest?.('.fopt');
  if (opt) {
    const {k, v} = opt.dataset;
    F[k].has(v) ? F[k].delete(v) : F[k].add(v);
    renderGrid();
    return;
  }
  const panel = $('#filterPanel');
  if (panel.classList.contains('on') && !ev.target.closest('#filterPanel')
      && !ev.target.closest('#filterBtn')) togglePanel(false);
});

function togglePanel(on) {
  const p = $('#filterPanel'), b = $('#filterBtn');
  const next = on ?? !p.classList.contains('on');
  p.classList.toggle('on', next);
  b.classList.toggle('on', next);
  b.setAttribute('aria-expanded', String(next));
  $('#archive').classList.toggle('shifted', next);
  measurePanel();
}

function measurePanel() {
  const p = $('#filterPanel');
  const h = p.classList.contains('on') ? p.offsetHeight : 0;
  document.documentElement.style.setProperty('--fh', h + 'px');
  p.querySelectorAll('.fopts').forEach(el =>
    el.classList.toggle('short', el.scrollHeight <= el.clientHeight + 2));
}
addEventListener('resize', measurePanel);
$('#filterBtn').onclick = e => { e.stopPropagation(); togglePanel(); };
$('#fClear').onclick = () => {
  for (const k of ['year','artist','venue']) F[k].clear();
  renderGrid();
};

/* ── routing ─────────────────────────────────────────── */
let idx = -1;

function route() {
  const h = location.hash || '#/';
  const m = h.match(/^#\/(gig|artist|venue)\/(.+)$/);
  document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
  togglePanel(false);
  stopRegionEdit();
  if (h === '#/venues' || h === '#/artists') {
    $('#detail').classList.add('on');
    idx = -1;
    renderIndex(h.slice(2));
  } else if (!m) {
    $(h === '#/archive' ? '#archive' : '#landing').classList.add('on');
    idx = -1;
  } else {
    $('#detail').classList.add('on');
    const [, kind, key] = m;
    $('#detail').classList.remove('group-view');
    if (kind === 'gig') renderGig(EVENTS.findIndex(e => String(e.id) === key));
    else if (kind === 'artist') renderGroup('artist', key);
    else renderGroup('venue', key);
  }
  scrollTo(0, 0);
}
addEventListener('hashchange', route);

/* ── gig page ────────────────────────────────────────── */
function renderGig(i) {
  if (i < 0) { location.hash = '#/archive'; return; }
  idx = i;
  const e = EVENTS[i];
  $('#detailTag').textContent = `No. ${String(i + 1).padStart(2, '0')} / ${EVENTS.length}`;
  const ticket = e.image
    ? `<div class="ticket" id="ticket" style="--mask:url(${e.image})">
         <img src="${e.image}" alt="Ticket for ${esc(e.artist)} at ${esc(e.venue)}">
         <div class="sheen"></div><div class="rlayer" id="rlayer"></div>
       </div>`
    : `<div class="ghostframe">No ticket yet</div>`;

  $('#detailBody').innerHTML = `
    <div class="hero">
      <div class="wm" aria-hidden="true">${esc(e.artist)}</div>
      <div class="gig">
        <div class="case"><div class="mount">${ticket}</div></div>
        <div>
          <h2 class="serif title" data-edit>${esc(e.artist)}</h2>
          <p class="kicker">${e.support ? 'with ' + esc(e.support) : e.cat}</p>
          <dl class="facts">
            <div><dt>Date</dt><dd data-edit>${fmt(e.date)}</dd></div>
            <div><dt>Venue</dt><dd><a href="#/venue/${slug(e.canon)}">${esc(e.canon)}</a>
              ${e.addr ? `<br><small>${esc(e.addr)}</small>` : ''}</dd></div>
            <div><dt>Artist</dt><dd><a href="#/artist/${slug(e.artist)}">All appearances</a></dd></div>
            <div><dt>Doors</dt><dd data-edit>${esc(e.doors || '—')}</dd></div>
            <div><dt>Paid</dt><dd data-edit>${money(e.face)}${e.fee != null ? ` <small>+ ${money(e.fee)} fee</small>` : ''}</dd></div>
            <div><dt>Promoter</dt><dd data-edit>${esc(e.promoter || '—')}</dd></div>
            <div><dt>Stub</dt><dd data-edit>${esc(e.ref || '—')}</dd></div>
          </dl>
          ${e.note ? `<p class="note" data-edit>${esc(e.note)}</p>` : ''}
          ${spotifyHTML(e)}
          <p class="sect">Media</p>
          ${mediaHTML(e)}
          <div class="pager">
            <button id="prev">← Previous</button><button id="next">Next →</button>
          </div>
        </div>
      </div>
      ${lineupHTML(e)}
    </div>`;

  $('#prev').onclick = () => { location.hash = '#/gig/' + EVENTS[(i - 1 + EVENTS.length) % EVENTS.length].id; };
  $('#next').onclick = () => { location.hash = '#/gig/' + EVENTS[(i + 1) % EVENTS.length].id; };
  drawRegions();
  bindTilt();
  syncEditable();
}

function lineupHTML(e) {
  const ls = LINEUPS[e.id];
  if (!ls) return '';
  const stages = ls.map(([stage, days, cols]) => {
    const depth = Math.max(...cols.map(c => c.length));
    const rows = [];
    for (let r = 0; r < depth; r++) {
      rows.push(`<tr${r === 0 ? ' class="head"' : ''}>` +
        cols.map(c => `<td>${c[r] ? esc(c[r]) : ''}</td>`).join('') + '</tr>');
    }
    return `<p class="stage">${esc(stage)}</p>
      <table><thead><tr>${days.map(d => `<th>${esc(d)}</th>`).join('')}</tr></thead>
      <tbody>${rows.join('')}</tbody></table>`;
  }).join('');
  return `<div class="lineup">${stages}<p class="src">Line-ups via eFestivals</p></div>`;
}

/* ── media and music ─────────────────────────────────── */
// a /shorts/ link is the only reliable signal that a video is vertical
const isShort = v => /\/shorts\//.test(String(v || ''));

const YT = v => {
  const m = String(v).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);
  return m ? m[1] : /^[\w-]{11}$/.test(v) ? v : null;
};

function spotifyHTML(e) {
  if (!e.spotify) return '';
  // accepts a share link, a spotify: URI, or a bare ID
  const m = String(e.spotify).match(/(track|album|episode|playlist)[/:]([A-Za-z0-9]+)/);
  const [kind, id] = m ? [m[1], m[2]] : ['track', String(e.spotify).trim()];
  if (!/^[A-Za-z0-9]+$/.test(id)) return '';
  return `<div class="spotify"><iframe loading="lazy" title="Spotify player"
    src="https://open.spotify.com/embed/${kind}/${id}?theme=0"
    allow="clipboard-write; encrypted-media; picture-in-picture"></iframe></div>`;
}

function mediaHTML(e) {
  const items = (e.media || []).filter(m => m.image || m.video || YT(m.youtube || ''));
  if (!items.length) {
    return `<div class="media">
      <a class="slot act" target="_blank" rel="noopener"
         href="https://www.youtube.com/results?search_query=${encodeURIComponent(
           e.artist + ' ' + e.venue + ' ' + e.date.slice(0,4))}">Search YouTube</a>
      <div class="slot">Nothing yet</div>
    </div>`;
  }
  return `<div class="media">${items.map((m, i) => {
    const id = YT(m.youtube || '');
    const vert = isShort(m.youtube);
    let thumb;
    if (id) {
      // a still stands in for the player, so nothing loads from YouTube
      // until it is actually clicked. oardefault is the original-aspect frame,
      // which for a Short is the full vertical one rather than a padded 16:9;
      // it is not generated for every video, so fall back on error
      thumb = `<img src="https://i.ytimg.com/vi/${id}/${vert ? 'oardefault' : 'hqdefault'}.jpg"
                 alt="${esc(m.caption || '')}" loading="lazy"
                 onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${id}/hqdefault.jpg'">`;
    } else if (m.video) {
      // an uploaded file has no thumbnail, so use a poster if one was given,
      // otherwise let the browser paint the first frame — metadata only, so
      // the file itself is not downloaded
      thumb = m.poster
        ? `<img src="${m.poster}" alt="${esc(m.caption || '')}" loading="lazy">`
        : `<video src="${m.video}#t=0.1" preload="metadata" muted
             playsinline tabindex="-1"></video>`;
    } else {
      thumb = `<img src="${m.image}" alt="${esc(m.caption || '')}" loading="lazy">`;
    }
    return `<div class="mthumb${vert ? ' vert' : ''}" data-gig="${e.id}" data-i="${i}">
      ${thumb}
      ${id || m.video ? '<span class="play">▶</span>' : ''}
      ${m.caption ? `<span class="tag">${esc(m.caption)}</span>` : ''}
    </div>`;
  }).join('')}</div>`;
}

function openLightbox(gigId, i) {
  const e = EVENTS.find(x => String(x.id) === String(gigId));
  const m = e && (e.media || [])[i];
  if (!m) return;
  const id = YT(m.youtube || '');
  $('#lightboxBody').innerHTML =
    id      ? `<iframe class="${isShort(m.youtube) ? 'vert' : ''}"
                 src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1"
                 title="${esc(m.caption || 'Video')}" allow="autoplay; fullscreen"
                 allowfullscreen></iframe>`
    : m.video ? `<video src="${m.video}" controls autoplay playsinline
                   ${m.poster ? `poster="${m.poster}"` : ''}></video>`
    :           `<img src="${m.image}" alt="${esc(m.caption || '')}">`;
  $('#lightboxCap').textContent = m.caption || '';
  $('#lightbox').classList.add('on');
}

function closeLightbox() {
  $('#lightbox').classList.remove('on');
  $('#lightboxBody').innerHTML = '';        // stops playback
}

document.addEventListener('click', ev => {
  const t = ev.target.closest?.('.mthumb');
  if (t) { openLightbox(t.dataset.gig, +t.dataset.i); return; }
  if (ev.target.closest?.('#lightbox .close') ||
      ev.target.id === 'lightbox') closeLightbox();
});

/* ── venue and artist indexes ────────────────────────── */
let idxSort = 'az';

function renderIndex(kind) {
  const field = kind === 'artists' ? 'artist' : 'canon';
  const counts = new Map();
  for (const e of EVENTS) counts.set(e[field], (counts.get(e[field]) || 0) + 1);

  const rows = [...counts].sort(idxSort === 'az'
    ? (a, b) => a[0].localeCompare(b[0])
    : (a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));

  $('#detail').classList.remove('group-view');
  $('#detailTag').textContent = `${rows.length} ${kind}`;
  $('#detailBody').innerHTML = `
    <div class="index">
      <h2 class="serif">${kind === 'artists' ? 'Artists' : 'Venues'}</h2>
      <div class="idxbar">
        <button data-sort="az"${idxSort === 'az' ? ' class="on"' : ''}>A–Z</button>
        <button data-sort="count"${idxSort === 'count' ? ' class="on"' : ''}>Most gigs</button>
      </div>
      <div class="ilist">${rows.map(([name, n]) => `
        <a href="#/${kind === 'artists' ? 'artist' : 'venue'}/${slug(name)}">
          <span class="nm">${esc(name)}</span>
          <span class="ct">${n}</span>
        </a>`).join('')}</div>
    </div>`;

  $('#detailBody').querySelectorAll('.idxbar button').forEach(b => {
    b.onclick = () => { idxSort = b.dataset.sort; renderIndex(kind); };
  });
}

/* ── artist / venue pages ────────────────────────────── */
function renderGroup(kind, key) {
  const field = kind === 'artist' ? 'artist' : 'canon';
  const rows = EVENTS.filter(e => slug(e[field]) === key);
  if (!rows.length) { location.hash = '#/archive'; return; }
  const name = rows[0][field];
  const photo = (kind === 'artist' ? ARTIST_PHOTO : VENUE_PHOTO)[name];
  const art = kind === 'venue' ? VENUE_ART[name] : null;
  const hero = photo
    ? `<figure class="ghero"><img src="${photo}" alt="${esc(name)}"></figure>`
    : (art && DRAW[art] ? `<figure class="ghero draw">${DRAW[art]}</figure>` : '');

  $('#detail').classList.add('group-view');
  $('#detailTag').textContent = kind;
  $('#detailBody').innerHTML = `
    <div class="group${hero ? '' : ' solo'}">
      <div class="gcol">
        <h2 class="serif gname">${esc(name)}</h2>
        <ul class="glist">${rows.map(e => `
          <li><a href="#/gig/${e.id}">
            <span class="y">${e.date.slice(0,4)}</span>
            <span class="n">${esc(kind === 'artist' ? e.canon : e.artist)}</span>
          </a></li>`).join('')}</ul>
      </div>
      ${hero}
    </div>`;
}

/* ── foil ────────────────────────────────────────────── */
const clipFor = r => r[0] === 'ellipse'
  ? `ellipse(${(r[3]/2*100).toFixed(2)}% ${(r[4]/2*100).toFixed(2)}% at ${((r[1]+r[3]/2)*100).toFixed(2)}% ${((r[2]+r[4]/2)*100).toFixed(2)}%)`
  : `inset(${(r[2]*100).toFixed(2)}% ${((1-r[1]-r[3])*100).toFixed(2)}% ${((1-r[2]-r[4])*100).toFixed(2)}% ${(r[1]*100).toFixed(2)}%)`;

function drawRegions() {
  const layer = document.getElementById('rlayer');
  if (!layer || idx < 0) return;
  layer.innerHTML = (EVENTS[idx].foil || [])
    .map(r => `<div class="region" style="clip-path:${clipFor(r)}"></div>`).join('');
  if (document.body.classList.contains('regions')) drawHandles();
}

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let card = null;

function setTilt(px, py) {
  if (!card || reduce) return;
  const k = matchMedia('(pointer:coarse)').matches ? 0.55 : 1;
  card.style.setProperty('--rx', ((0.5 - py) * 13 * k).toFixed(2) + 'deg');
  card.style.setProperty('--ry', ((px - 0.5) * 17 * k).toFixed(2) + 'deg');
  card.style.setProperty('--fx', (18 + px * 64).toFixed(1) + '%');
  card.style.setProperty('--fy', (18 + py * 64).toFixed(1) + '%');
  card.style.setProperty('--gx', (px * 100).toFixed(1) + '%');
  card.style.setProperty('--gy', (py * 100).toFixed(1) + '%');
  card.style.setProperty('--foilO', (0.34 + Math.abs(px - 0.5) * 0.62).toFixed(2));
  card.style.setProperty('--sa', (72 + px * 46).toFixed(0) + 'deg');
}

function bindTilt() {
  card = document.getElementById('ticket');
  if (!card) return;
  if (document.body.classList.contains('regions')) { drawHandles(); return; }
  const stage = card.closest('.case');
  stage.onpointermove = ev => {
    const r = stage.getBoundingClientRect();
    card.classList.add('live');
    setTilt((ev.clientX - r.left) / r.width, (ev.clientY - r.top) / r.height);
  };
  stage.onpointerleave = () => { card.classList.remove('live'); setTilt(0.5, 0.5); };
  setTilt(0.5, 0.44);
}

function startGyro() {
  addEventListener('deviceorientation', ev => {
    if (!card || ev.beta == null) return;
    card.classList.add('live');
    setTilt(0.5 + Math.max(-1, Math.min(1, (ev.gamma || 0) / 34)) * 0.5,
            0.5 + Math.max(-1, Math.min(1, ((ev.beta || 45) - 45) / 40)) * 0.5);
  });
}
if (typeof DeviceOrientationEvent !== 'undefined'
    && typeof DeviceOrientationEvent.requestPermission !== 'function'
    && matchMedia('(pointer:coarse)').matches) startGyro();

/* ── foil region editor ──────────────────────────────── */
let sel = -1, shape = 'ellipse', drag = null;
const R3 = n => Math.round(n * 1000) / 1000;
const regs = () => (EVENTS[idx].foil ||= []);
const norm = ev => {
  const b = document.querySelector('#ticket img').getBoundingClientRect();
  return {x: (ev.clientX - b.left) / b.width, y: (ev.clientY - b.top) / b.height};
};

function drawHandles() {
  const c = document.getElementById('ticket');
  if (!c) return;
  c.querySelectorAll('.rbox,#rhint').forEach(n => n.remove());
  regs().forEach((r, i) => {
    const d = document.createElement('div');
    d.className = 'rbox' + (r[0] === 'ellipse' ? ' el' : '') + (i === sel ? ' sel' : '');
    d.dataset.i = i;
    d.style.cssText = `left:${r[1]*100}%;top:${r[2]*100}%;width:${r[3]*100}%;height:${r[4]*100}%`;
    if (i === sel) for (const h of ['nw','ne','sw','se']) {
      const g = document.createElement('i'); g.className = 'h ' + h; g.dataset.h = h; d.appendChild(g);
    }
    c.appendChild(d);
  });
  const p = document.createElement('p'); p.id = 'rhint';
  const r = regs()[sel];
  p.innerHTML = r
    ? `${r[0]} · x ${R3(r[1])} y ${R3(r[2])} · w ${R3(r[3])} h ${R3(r[4])}<br>
       drag to move · corners resize · arrows nudge · R shape · ⌫ delete`
    : 'Drag across the ticket to mark where the foil sits';
  c.appendChild(p);
}

function applyDrag(p) {
  const r = regs()[sel]; if (!r) return;
  const o = drag.orig, dx = p.x - drag.start.x, dy = p.y - drag.start.y;
  if (drag.mode === 'new') {
    r[1] = Math.min(drag.start.x, p.x); r[2] = Math.min(drag.start.y, p.y);
    r[3] = Math.abs(p.x - drag.start.x); r[4] = Math.abs(p.y - drag.start.y);
  } else if (drag.mode === 'move') {
    r[1] = o[1] + dx; r[2] = o[2] + dy;
  } else {
    let x1 = o[1], y1 = o[2], x2 = o[1] + o[3], y2 = o[2] + o[4];
    if (drag.h.includes('n')) y1 = o[2] + dy; else y2 = o[2] + o[4] + dy;
    if (drag.h.includes('w')) x1 = o[1] + dx; else x2 = o[1] + o[3] + dx;
    r[1] = Math.min(x1, x2); r[2] = Math.min(y1, y2);
    r[3] = Math.abs(x2 - x1); r[4] = Math.abs(y2 - y1);
  }
  drawRegions(); drawHandles();
}

function startRegionEdit() {
  const c = document.getElementById('ticket'); if (!c) return;
  document.body.classList.add('regions');
  sel = -1; drawHandles();
  const stage = c.closest('.case');
  stage.onpointermove = stage.onpointerleave = null;
  stage.onpointerdown = ev => {
    const box = ev.target.closest?.('.rbox'), grip = ev.target.closest?.('.h');
    const p = norm(ev);
    if (grip && box) { sel = +box.dataset.i; drag = {mode:'resize', h:grip.dataset.h, start:p, orig:[...regs()[sel]]}; }
    else if (box) { sel = +box.dataset.i; drag = {mode:'move', start:p, orig:[...regs()[sel]]}; }
    else { regs().push([shape, p.x, p.y, 0, 0]); sel = regs().length - 1; drag = {mode:'new', start:p}; }
    stage.setPointerCapture(ev.pointerId);
    drawRegions(); drawHandles(); ev.preventDefault();
  };
  stage.onpointermove = ev => { if (drag) applyDrag(norm(ev)); };
  stage.onpointerup = () => {
    const r = regs()[sel];
    if (drag && drag.mode === 'new' && r && (r[3] < 0.012 || r[4] < 0.012)) {
      regs().pop(); sel = -1; drawRegions(); drawHandles();
    }
    drag = null;
  };
}

function stopRegionEdit() {
  if (!document.body.classList.contains('regions')) return;
  document.body.classList.remove('regions');
  $('#foilEdit')?.classList.remove('on');
  const c = document.getElementById('ticket');
  if (c) {
    const stage = c.closest('.case');
    stage.onpointerdown = stage.onpointermove = stage.onpointerup = null;
    c.querySelectorAll('.rbox,#rhint').forEach(n => n.remove());
  }
  drag = null; sel = -1;
  bindTilt();
}

/* ── controls ────────────────────────────────────────── */
$('#foilBtn').onclick = e => {
  const off = document.body.classList.toggle('nofoil');
  e.currentTarget.textContent = 'Foil ' + (off ? 'off' : 'on');
};
function syncEditable() {
  const on = document.body.classList.contains('admin');
  document.querySelectorAll('[data-edit]').forEach(el => el.contentEditable = on);
}
$('#adminBtn').onclick = () => { document.body.classList.toggle('admin'); syncEditable(); };
$('#exitAdmin').onclick = () => {
  document.body.classList.remove('admin'); stopRegionEdit(); syncEditable();
};
$('#pubPill').onclick = e => {
  const on = e.currentTarget.classList.toggle('on');
  e.currentTarget.textContent = on ? 'Published' : 'Draft';
};
$('#foilEdit').onclick = e => {
  if (document.body.classList.contains('regions')) { stopRegionEdit(); return; }
  document.body.classList.add('admin'); syncEditable();
  e.currentTarget.classList.add('on'); startRegionEdit();
};

addEventListener('keydown', ev => {
  if (document.activeElement?.isContentEditable) return;
  if (document.body.classList.contains('regions')) {
    const r = regs()[sel], k = ev.key;
    if ((k === 'Backspace' || k === 'Delete') && r) {
      ev.preventDefault(); regs().splice(sel, 1); sel = -1; drawRegions(); drawHandles(); return;
    }
    if (k.toLowerCase() === 'r' && r) {
      r[0] = r[0] === 'ellipse' ? 'rect' : 'ellipse'; shape = r[0];
      drawRegions(); drawHandles(); return;
    }
    const step = ev.shiftKey ? 0.02 : 0.0025;
    const d = {ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1]}[k];
    if (d && r) {
      ev.preventDefault();
      if (ev.altKey) { r[3] = Math.max(.01, r[3] + d[0]*step); r[4] = Math.max(.01, r[4] + d[1]*step); }
      else { r[1] += d[0]*step; r[2] += d[1]*step; }
      drawRegions(); drawHandles();
    }
    return;
  }
  if (idx > -1 && ev.key === 'ArrowRight') $('#next')?.click();
  if (idx > -1 && ev.key === 'ArrowLeft') $('#prev')?.click();
  if (ev.key === 'Escape') {
    if ($('#lightbox').classList.contains('on')) { closeLightbox(); return; }
    if ($('#filterPanel').classList.contains('on')) { togglePanel(false); return; }
    location.hash = idx > -1 ? '#/archive' : '#/';
  }
  if (ev.key.toLowerCase() === 'a') { document.body.classList.toggle('admin'); syncEditable(); }
});

/* ── boot ────────────────────────────────────────────── */
async function boot() {
  const grab = async p => (await fetch(p, {cache: 'no-cache'})).json();
  const [gigs, venues, artists, lineups] = await Promise.all(
    ['data/gigs.json', 'data/venues.json', 'data/artists.json', 'data/lineups.json'].map(grab));

  EVENTS = gigs.gigs.sort((a, b) => a.date.localeCompare(b.date));
  // the editor works on positional regions; the stored form is self-describing
  for (const e of EVENTS)
    e.foil = (e.foil || []).map(f => [f.shape, f.x, f.y, f.w, f.h]);
  LINEUPS = lineups;
  for (const v of venues.venues) if (v.image) VENUE_PHOTO[v.name] = v.image;
  for (const a of artists.artists) if (a.image) ARTIST_PHOTO[a.name] = a.image;

  STATS = {
    count: EVENTS.length,
    venues: new Set(EVENTS.map(e => e.canon)).size,
    spend: EVENTS.reduce((t, e) => t + (e.face || 0) + (e.fee || 0), 0),
    from: EVENTS[0]?.date.slice(0, 4),
    to: EVENTS.at(-1)?.date.slice(0, 4),
  };

  paintLanding();
  renderGrid();
  route();
}

boot().catch(err => {
  console.error(err);
  document.getElementById('landingArt').innerHTML =
    '<p style="font-size:11px;color:#888">Could not load the archive data.</p>';
});
</script>
</body>
</html>
